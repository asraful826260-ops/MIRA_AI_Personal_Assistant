
name: MIRA AI - Complete APK Builder

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build MIRA Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract MIRA project ZIP
        shell: bash
        run: |
          mkdir -p mira-src

          if [ -f "MIRA_AI_Personal_Assistant.zip" ]; then
            unzip -q MIRA_AI_Personal_Assistant.zip -d mira-src
            echo "ZIP extracted successfully"
            SRC="mira-src"
          else
            echo "ZIP not found. Using repository files."
            SRC="."
          fi

          PROJECT_FILE=$(find "$SRC" \
            -type f \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: Gradle settings file not found!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_FILE")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "MIRA project found at: $PROJECT_DIR"
          find "$PROJECT_DIR" -maxdepth 3 -type f

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        run: |
          curl -L \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip \
            -o gradle.zip

          unzip -q gradle.zip -d "$HOME"
          echo "$HOME/gradle-8.9/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build MIRA Debug APK
        working-directory: ${{ github.workspace }}
        run: |
          cd "$PROJECT_DIR"

          gradle --no-daemon clean assembleDebug

      - name: Find generated APK
        run: |
          echo "Searching for APK..."

          find "$PROJECT_DIR" \
            -type f \
            -path "*/build/outputs/apk/*/*.apk"

      - name: Upload MIRA APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-AI-Android-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

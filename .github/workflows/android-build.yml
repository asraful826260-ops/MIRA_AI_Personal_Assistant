name: MIRA Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract MIRA ZIP
        run: |
          mkdir -p mira-src
          unzip -q MIRA_AI_Personal_Assistant.zip -d mira-src
          echo "--- Contents of mira-src ---"
          ls -R mira-src

      - name: Find Gradle Wrapper
        run: |
          # Search for gradlew inside mira-src
          GRADLEW=$(find mira-src -maxdepth 3 -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: Gradle wrapper not found!"
            exit 1
          fi

          GRADLEW_DIR=$(dirname "$GRADLEW")
          echo "Found gradlew at: $GRADLEW"
          echo "GRADLEW_DIR=$GRADLEW_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build MIRA APK
        run: |
          cd "$GRADLEW_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        run: |
          APK=$(find mira-src -type f -path "*/build/outputs/apk/debug/*.apk" -print -quit)

          if [ -z "$APK" ]; then
            echo "APK file not found!"
            exit 1
          fi

          cp "$APK" MIRA_AI.apk

      - name: Upload MIRA APK
        uses: actions/upload-artifact@v4
        with:
          name: MIRA-AI-APK
          path: MIRA_AI.apk
